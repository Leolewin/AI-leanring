name: Update AI radar

on:
  workflow_dispatch:
  schedule:
    - cron: "17 0,8,16 * * *"

permissions:
  contents: write

concurrency:
  group: update-ai-radar
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect official AI signals
        run: python scripts/update_news.py
      - name: Commit changed data
        run: |
          if git diff --quiet -- data/news.json data/ecosystem.json; then
            echo "No signal changes"
            exit 0
          fi
          git config user.name "ai-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/news.json data/ecosystem.json
          git commit -m "chore: refresh AI radar"
          git push
